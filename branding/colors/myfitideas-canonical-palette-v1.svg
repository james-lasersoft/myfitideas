<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">MyFitIdeas Canonical Palette v1.0</title>
  <desc id="desc">Color swatch reference for the MyFitIdeas brand showing Growth, Spring Bud, Deep Stem, Young Moss, Morning Dew, and Spring Sunrise.</desc>
  <rect width="1600" height="1000" fill="#FFFFFF"/>
  <text x="100" y="110" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" fill="#1F2937">MyFitIdeas Canonical Palette v1.0</text>
  <text x="100" y="165" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#4B5563">Early-spring growth, transformation, vitality, optimism, and renewal</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(100,230)">
      <rect width="420" height="250" rx="24" fill="#5FCB3C"/>
      <text x="30" y="55" font-size="34" font-weight="700" fill="#17351A">Growth</text>
      <text x="30" y="185" font-size="28" font-weight="700" fill="#17351A">#5FCB3C</text>
      <text x="30" y="222" font-size="22" fill="#17351A">RGB 95, 203, 60</text>
    </g>
    <g transform="translate(590,230)">
      <rect width="420" height="250" rx="24" fill="#A6E84A"/>
      <text x="30" y="55" font-size="34" font-weight="700" fill="#29420F">Spring Bud</text>
      <text x="30" y="185" font-size="28" font-weight="700" fill="#29420F">#A6E84A</text>
      <text x="30" y="222" font-size="22" fill="#29420F">RGB 166, 232, 74</text>
    </g>
    <g transform="translate(1080,230)">
      <rect width="420" height="250" rx="24" fill="#1F8B43"/>
      <text x="30" y="55" font-size="34" font-weight="700" fill="#FFFFFF">Deep Stem</text>
      <text x="30" y="185" font-size="28" font-weight="700" fill="#FFFFFF">#1F8B43</text>
      <text x="30" y="222" font-size="22" fill="#FFFFFF">RGB 31, 139, 67</text>
    </g>

    <g transform="translate(100,540)">
      <rect width="420" height="250" rx="24" fill="#DDF7C8" stroke="#C7EAB0" stroke-width="3"/>
      <text x="30" y="55" font-size="34" font-weight="700" fill="#29420F">Young Moss</text>
      <text x="30" y="185" font-size="28" font-weight="700" fill="#29420F">#DDF7C8</text>
      <text x="30" y="222" font-size="22" fill="#29420F">RGB 221, 247, 200</text>
    </g>
    <g transform="translate(590,540)">
      <rect width="420" height="250" rx="24" fill="#F5FDF0" stroke="#DDEBD7" stroke-width="3"/>
      <text x="30" y="55" font-size="34" font-weight="700" fill="#1F2937">Morning Dew</text>
      <text x="30" y="185" font-size="28" font-weight="700" fill="#1F2937">#F5FDF0</text>
      <text x="30" y="222" font-size="22" fill="#1F2937">RGB 245, 253, 240</text>
    </g>
    <g transform="translate(1080,540)">
      <rect width="420" height="250" rx="24" fill="#FFD54A"/>
      <text x="30" y="55" font-size="34" font-weight="700" fill="#4A3A00">Spring Sunrise</text>
      <text x="30" y="185" font-size="28" font-weight="700" fill="#4A3A00">#FFD54A</text>
      <text x="30" y="222" font-size="22" fill="#4A3A00">RGB 255, 213, 74</text>
    </g>
  </g>

  <text x="100" y="880" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#1F2937">Canonical logo assignment</text>
  <text x="100" y="925" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#4B5563">Leaves: Growth  |  Head and body: Spring Bud  |  Accent: Spring Sunrise is reserved for achievements and insights</text>
  <text x="1500" y="965" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6B7280">Phase 2.1 • 2026-07-31</text>
</svg>
