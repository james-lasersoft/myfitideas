      <stop offset="0" stop-color="#86D93D"/>
      <stop offset="0.45" stop-color="#22A447"/>
      <stop offset="1" stop-color="#075E33"/>
    </linearGradient>
    <linearGradient id="leafSide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#63C83B"/>
      <stop offset="0.42" stop-color="#159B45"/>
      <stop offset="1" stop-color="#064F2D"/>
    </linearGradient>
    <linearGradient id="personFill" x1="0" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#A8E53E"/>
      <stop offset="1" stop-color="#73C52B"/>
    </linearGradient>
  </defs>
  <g id="master-symbol" transform="translate(0,10)">
