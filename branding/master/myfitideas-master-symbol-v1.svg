<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">My Fit Ideas master symbol</title>
  <desc id="desc">Three-leaf growth emblem with a person emerging from a shared stem.</desc>
  <defs>
