    <path id="left-leaf" fill="url(#leafSide)" d="M82 410 C230 372 377 398 466 506 C500 548 519 600 524 660 C420 718 306 737 202 702 C118 674 68 612 50 514 C46 484 58 447 82 410 Z"/>
    <path id="right-leaf" fill="url(#leafSide)" d="M918 410 C770 372 623 398 534 506 C500 548 481 600 476 660 C580 718 694 737 798 702 C882 674 932 612 950 514 C954 484 942 447 918 410 Z"/>
    <g id="person-and-stem" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
      <path id="left-stem-arm" fill="none" d="M494 865 C486 763 470 678 438 612 C407 547 365 504 312 468"/>
      <path id="right-stem-arm" fill="none" d="M506 865 C514 763 530 678 562 612 C593 547 635 504 688 468"/>
      <path id="center-stem" fill="none" d="M500 866 C500 782 500 698 500 624"/>
      <circle id="head" cx="500" cy="430" r="78" fill="url(#personFill)"/>
    </g>
    <path id="stem-core" fill="url(#personFill)" d="M483 870 C485 792 475 719 454 655 C438 607 415 563 383 522 C420 548 458 560 500 560 C542 560 580 548 617 522 C585 563 562 607 546 655 C525 719 515 792 517 870 Z"/>
