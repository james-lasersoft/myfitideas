name: Frontend localization guard

on:
  pull_request:
    paths:
      - "src/frontend/**"
      - "src/backend/prisma/seed-translations.ts"
      - ".github/workflows/frontend-localization.yml"
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "src/frontend/**"
      - "src/backend/prisma/seed-translations.ts"
      - ".github/workflows/frontend-localization.yml"

permissions:
  contents: read

jobs:
  localization:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Run localization guard
        working-directory: src/frontend
        run: npm run check:i18n

      - name: Run frontend lint
        working-directory: src/frontend
        run: npm run lint

      - name: Build frontend
        working-directory: src/frontend
        run: npm run build
